name: Build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Publish a GitHub release with the packages
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - run: sudo apt-get update && sudo apt-get install -y genisoimage

      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

      - id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          release=$(sed -n '/^\[package.metadata.deb\]/,/^\[/s/^revision = "\(.*\)"/\1/p' Cargo.toml)
          echo "version=$version-$release" >> "$GITHUB_OUTPUT"

  package:
    needs: test
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      TARGET: ${{ matrix.arch }}-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}

      - run: cargo install --locked cargo-deb cargo-generate-rpm

      # static binary, so the packages work on any distribution release
      - run: cargo build --release --locked --target $TARGET

      - run: |
          file target/$TARGET/release/pxvirt-isoinfo
          target/$TARGET/release/pxvirt-isoinfo --version

      - run: |
          cargo deb --no-build --target $TARGET --output out/
          cargo generate-rpm --target $TARGET --output out/

      - run: |
          sudo dpkg -i out/*.deb
          pxvirt-isoinfo --version
          rpm -qlp out/*.rpm

      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.arch }}
          path: out/*

  release:
    needs: [test, package]
    if: >-
      inputs.release ||
      (github.event_name == 'push' &&
       github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v${{ needs.test.outputs.version }}
    steps:
      - id: check
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG already exists, skipping"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.check.outputs.exists != 'true'
        uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
          pattern: 'packages-*'

      - if: steps.check.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: pxvirt-isoinfo ${{ needs.test.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: out/*
