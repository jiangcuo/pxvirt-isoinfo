name: Build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Publish a GitHub release with the packages
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - run: sudo apt-get update && sudo apt-get install -y genisoimage

      - run: cargo fmt --check
      # new lints of newer toolchains are reported, but only fail on real problems
      - run: cargo clippy --locked --all-targets -- -D clippy::correctness -D clippy::suspicious
      - run: cargo test --locked

      - id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          release=$(sed -n '/^\[package.metadata.deb\]/,/^\[/s/^revision = "\(.*\)"/\1/p' Cargo.toml)
          echo "version=$version-$release" >> "$GITHUB_OUTPUT"

  package:
    needs: test
    runs-on: ubuntu-latest
    container: pxvirt/musl:latest
    env:
      # the toolchain is installed for root, GitHub sets HOME to /github/home
      CARGO_HOME: /root/.cargo
      RUSTUP_HOME: /root/.rustup
      TARGETS: >-
        x86_64-unknown-linux-musl
        aarch64-unknown-linux-musl
        riscv64gc-unknown-linux-musl
        loongarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          if command -v rustup >/dev/null; then rustup target add $TARGETS; fi
          command -v cargo-deb >/dev/null || cargo install --locked cargo-deb
          command -v cargo-generate-rpm >/dev/null || cargo install --locked cargo-generate-rpm

      # static binaries, linkers are configured in .cargo/config.toml
      - name: Build
        run: |
          for target in $TARGETS; do
            cargo build --release --locked --target $target
          done
          target/x86_64-unknown-linux-musl/release/pxvirt-isoinfo --version

      - name: Package
        run: |
          for target in $TARGETS; do
            arch=${target%%-*}
            [ "$arch" = riscv64gc ] && arch=riscv64
            cargo deb --no-build --target $target --output out/
            cargo generate-rpm --target $target --arch $arch --output out/
          done
          ls -l out/

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: out/*

  release:
    needs: [test, package]
    if: >-
      inputs.release ||
      (github.event_name == 'push' &&
       github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v${{ needs.test.outputs.version }}
    steps:
      - id: check
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG already exists, skipping"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.check.outputs.exists != 'true'
        uses: actions/download-artifact@v4
        with:
          path: out
          name: packages

      - if: steps.check.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: pxvirt-isoinfo ${{ needs.test.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: out/*
