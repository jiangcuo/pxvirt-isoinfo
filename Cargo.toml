[package]
name = "pxvirt-isoinfo"
version = "0.1.0"
edition = "2024"
description = "Detect the operating system on installation images without mounting them"
license = "AGPL-3.0-or-later"
rust-version = "1.88"

[dependencies]
anyhow = "1.0.104"
regex = "1.13.1"
roxmltree = "0.21.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[profile.release]
lto = true
codegen-units = 1
strip = true
